<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Expenses – {% block title %}{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <!-- DataTables + Buttons -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" crossorigin="anonymous">
  <!-- Custom dark theme -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<div class="app-wrapper">

  <!-- ── SIDEBAR ── -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🍽️</div>
      <div>
        <div class="brand-title">Canteen</div>
        <div class="brand-sub">Expenses</div>
      </div>
    </div>
    <ul class="sidebar-nav">
      <li class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
        <a href="{{ url_for('dashboard') }}"><i class="fas fa-gauge-high"></i> Dashboard</a>
      </li>
      <li class="{% if request.endpoint == 'employees' %}active{% endif %}">
        <a href="{{ url_for('employees') }}"><i class="fas fa-users"></i> Employees</a>
      </li>
      <li class="{% if request.endpoint == 'trend' %}active{% endif %}">
        <a href="{{ url_for('trend') }}"><i class="fas fa-chart-line"></i> Trend Analysis</a>
      </li>
      <li class="{% if request.endpoint == 'comparison' %}active{% endif %}">
        <a href="{{ url_for('comparison') }}"><i class="fas fa-scale-balanced"></i> Comparison</a>
      </li>
      <li class="{% if request.endpoint == 'reports' %}active{% endif %}">
        <a href="{{ url_for('reports') }}"><i class="fas fa-file-chart-column"></i> Reports</a>
      </li>
    </ul>
  </nav>

  <!-- ── MAIN ── -->
  <div id="main-content">
    <header class="main-header">
      <h1>{% block page_title %}{% endblock %}</h1>
    </header>
    <div class="content-body">
      {% block content %}{% endblock %}
    </div>
  </div>

</div><!-- /.app-wrapper -->

<!-- JS libs -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.7/build/pdfmake.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.7/build/vfs_fonts.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js" crossorigin="anonymous"></script>

<script>
// ── global Chart.js defaults ──────────────────────────────────────
Chart.defaults.color           = '#7fa8c9';
Chart.defaults.borderColor     = '#1b3a5c';
Chart.defaults.font.family     = "'Segoe UI', system-ui, sans-serif";
Chart.defaults.font.size       = 12;

// ── shared helpers ────────────────────────────────────────────────
function fmtCurrency(v) {
  return 'Rs\u00a0' + Number(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtNum(v, dec = 0) {
  return Number(v).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}

function buildPeriodParams() {
  const fp = document.getElementById('fromPeriod')?.value || '';
  const tp = document.getElementById('toPeriod')?.value   || '';
  const p = new URLSearchParams();
  if (fp) p.append('from_period', fp);
  if (tp) p.append('to_period',   tp);
  return p.toString() ? '?' + p.toString() : '';
}

function initPeriodFilter(onApply) {
  document.getElementById('btnApply')?.addEventListener('click', onApply);
  document.getElementById('btnReset')?.addEventListener('click', () => {
    document.getElementById('fromPeriod').value = '';
    document.getElementById('toPeriod').value   = '';
    onApply();
  });
}

// ── shared chart options builder ──────────────────────────────────
function lineOpts(yLabel, tooltipFmt) {
  return {
    responsive: true,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { labels: { color: '#a8c0d6', boxWidth: 14, padding: 16 } },
      tooltip: {
        backgroundColor: '#0e2035',
        borderColor: '#1b3a5c', borderWidth: 1,
        titleColor: '#4fc3f7', bodyColor: '#dceaf8',
        callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + tooltipFmt(ctx.parsed.y) }
      }
    },
    scales: {
      x: { ticks: { color: '#7fa8c9', maxRotation: 45, minRotation: 30, font: { size: 11 } },
           grid:  { color: '#1b3a5c' } },
      y: { ticks: { color: '#7fa8c9', callback: v => yLabel(v) },
           grid:  { color: '#1b3a5c' } }
    }
  };
}

function barOpts(tooltipFmt, stacked) {
  const o = lineOpts(v => fmtNum(v), tooltipFmt);
  o.scales.x.stacked = stacked || false;
  o.scales.y.stacked = stacked || false;
  return o;
}

function makeDatasets(labels, valMap, colorMap, type) {
  return labels.map(lbl => {
    const clr = colorMap[lbl] || '#888';
    return {
      label: lbl,
      data:  valMap[lbl] || [],
      backgroundColor: type === 'line' ? clr + '22' : clr + 'cc',
      borderColor:     clr,
      pointBackgroundColor: clr,
      fill: type === 'line',
      tension: 0.35,
      borderWidth: 2,
    };
  });
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
