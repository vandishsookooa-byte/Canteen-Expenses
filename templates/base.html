<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canteen Expenses{% block title_suffix %}{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        crossorigin="anonymous" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        crossorigin="anonymous" />
  <!-- DataTables + Buttons -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" crossorigin="anonymous" />
  <!-- Custom -->
  <link rel="stylesheet" href="/static/css/style.css" />

  {% block head %}{% endblock %}
</head>
<body>

<!-- ===== Sidebar ===== -->
<nav id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-cup-hot-fill"></i></div>
    <div class="brand-text">
      <span class="brand-title">Canteen</span>
      <span class="brand-sub">Expenses</span>
    </div>
  </div>

  <ul class="nav-links">
    <li class="{{ 'active' if active == 'dashboard' }}">
      <a href="/"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
    </li>
    <li class="{{ 'active' if active == 'employees' }}">
      <a href="/employees"><i class="bi bi-people-fill"></i><span>Employees</span></a>
    </li>
    <li class="{{ 'active' if active == 'trends' }}">
      <a href="/trends"><i class="bi bi-graph-up-arrow"></i><span>Trend Analysis</span></a>
    </li>
    <li class="{{ 'active' if active == 'comparison' }}">
      <a href="/comparison"><i class="bi bi-bar-chart-fill"></i><span>Comparison</span></a>
    </li>
    <li class="{{ 'active' if active == 'reports' }}">
      <a href="/reports"><i class="bi bi-file-earmark-bar-graph-fill"></i><span>Reports</span></a>
    </li>
  </ul>
</nav>

<!-- ===== Main content ===== -->
<div id="main-content">
  <!-- Top bar -->
  <div id="topbar">
    <button id="sidebar-toggle" class="btn btn-link"><i class="bi bi-list fs-4"></i></button>
    <h5 id="page-title">{% block page_title %}Canteen Expenses{% endblock %}</h5>
  </div>

  <div id="content-area">
    {% block content %}{% endblock %}
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js" crossorigin="anonymous"></script>
<!-- DataTables Buttons + export libraries -->
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js" crossorigin="anonymous"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<!-- App shared JS -->
<script src="/static/js/app.js"></script>

<script>
  // Sidebar toggle
  document.getElementById('sidebar-toggle').addEventListener('click', function () {
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('main-content').classList.toggle('expanded');
  });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
