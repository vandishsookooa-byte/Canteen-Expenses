{% extends "base.html" %}
{% block title %}Employees{% endblock %}
{% block page_title %}Employees{% endblock %}

{% block content %}
<div class="filter-bar card">
  <label>From Period:</label>
  <select id="periodFrom" class="form-select">
    <option value="">All Periods</option>
    {% for p in periods %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
  </select>
  <label>To Period:</label>
  <select id="periodTo" class="form-select">
    <option value="">All Periods</option>
    {% for p in periods %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
  </select>
  <button class="btn btn-primary" onclick="loadTable()">Apply</button>
  <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
</div>

<div class="card">
  <div class="card-header">Employee Count by Period &amp; Nationality</div>
  <div class="table-responsive">
    <table id="employeesTable" class="data-table">
      <thead>
        <tr>
          <th>Period</th>
          <th style="text-align:right">Bangladeshi</th>
          <th style="text-align:right">Indian</th>
          <th style="text-align:right">Malagasy</th>
          <th style="text-align:right">Sri Lankan</th>
          <th style="text-align:right">Total</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6" class="text-center">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let dt = null;

function resetFilters() {
  document.getElementById('periodFrom').value = '';
  document.getElementById('periodTo').value = '';
  loadTable();
}

function buildQuery() {
  const from = document.getElementById('periodFrom').value;
  const to = document.getElementById('periodTo').value;
  const parts = [];
  if (from) parts.push('from=' + encodeURIComponent(from));
  if (to) parts.push('to=' + encodeURIComponent(to));
  return parts.join('&');
}

async function loadTable() {
  const res = await fetch('/api/employees?' + buildQuery());
  const rows = await res.json();
  const tbody = document.getElementById('tableBody');

  if (dt) { dt.destroy(); dt = null; }

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center empty-state">No data available</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.period}</td>
      <td class="num-cell">${r.bangladeshi}</td>
      <td class="num-cell">${r.indian}</td>
      <td class="num-cell">${r.malagasy}</td>
      <td class="num-cell">${r.srilankan}</td>
      <td class="num-cell total-cell">${r.total}</td>
    </tr>
  `).join('');

  dt = $('#employeesTable').DataTable({
    order: [],
    pageLength: 25,
    lengthMenu: [10, 25, 50, 100],
    language: { emptyTable: 'No data available' }
  });
}

async function refreshPeriodSelects() {
  try {
    const res = await fetch('/api/periods', { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
    const periods = await res.json();
    const opts = '<option value="">All Periods</option>' +
      periods.map(p => `<option value="${p}">${p}</option>`).join('');
    document.getElementById('periodFrom').innerHTML = opts;
    document.getElementById('periodTo').innerHTML = opts;
  } catch (_) {}
}

document.addEventListener('DOMContentLoaded', async () => {
  await refreshPeriodSelects();
  loadTable();
});
</script>
{% endblock %}
